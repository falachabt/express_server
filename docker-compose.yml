version: '3.8'

services:
  express-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: express-server-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      # Add your environment variables here
      # - CORS_ORIGIN=https://yourdomain.com
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - express-network

networks:
  express-network:
    driver: bridge
